<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <rect id="bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <!-- 页眉 -->
  <text id="header-tag" x="64" y="48" font-family="SimHei, &quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" fill="#00B0F0" letter-spacing="3">PART 1 · 指标体系</text>
  <text id="header-page" x="1216" y="48" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" fill="#5A6B7B" text-anchor="end">02 / 10</text>
  <!-- 页面标题（结论先行） -->
  <text id="page-title" x="64" y="120" font-family="SimHei, &quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="56" font-weight="bold" fill="#0F2B46">八维指标覆盖调度全链路，估算透明、口径统一</text>
  <!-- 核心信息行 -->
  <text id="lead-line" x="64" y="170" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="24" fill="#1A2433">后端统计覆盖 10 个子模块，映射为 8 类业务维度——每项均有明确口径、数据来源与前端实时展示</text>
  <!-- 8 张维度卡 4x2 -->
  <g id="card-row1">
    <rect id="c1" x="64" y="210" width="272" height="190" rx="12" fill="#F4F7FA" stroke="#D7E0E8" stroke-width="1"/>
    <use data-icon="tabler-outline/truck" x="88" y="234" width="36" height="36" fill="none" stroke="#0F2B46" stroke-width="2"/>
    <text id="c1-t" x="88" y="300" font-family="SimHei, &quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="24" font-weight="bold" fill="#0F2B46">车辆概况</text>
    <text id="c1-d" x="88" y="330" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#5A6B7B">车型分布 · 运能分布 · 货舱载货 · 位置聚散</text>
    <text id="c1-n" x="88" y="366" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#00B0F0">运力池画像，指标分母基础</text>
    <rect id="c2" x="360" y="210" width="272" height="190" rx="12" fill="#F4F7FA" stroke="#D7E0E8" stroke-width="1"/>
    <use data-icon="tabler-outline/gauge" x="384" y="234" width="36" height="36" fill="none" stroke="#0F2B46" stroke-width="2"/>
    <text id="c2-t" x="384" y="300" font-family="SimHei, &quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="24" font-weight="bold" fill="#0F2B46">利用率 U</text>
    <text id="c2-d" x="384" y="330" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#5A6B7B">U2 装载率 · U3 在线率 · U4 空驶率</text>
    <text id="c2-n" x="384" y="366" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#00B0F0">维修中车辆剔除，口径不失真</text>
    <rect id="c3" x="656" y="210" width="272" height="190" rx="12" fill="#F4F7FA" stroke="#D7E0E8" stroke-width="1"/>
    <use data-icon="tabler-outline/clock" x="680" y="234" width="36" height="36" fill="none" stroke="#0F2B46" stroke-width="2"/>
    <text id="c3-t" x="680" y="300" font-family="SimHei, &quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="24" font-weight="bold" fill="#0F2B46">时间与响应 T</text>
    <text id="c3-d" x="680" y="330" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#5A6B7B">车辆/货物等待 · T2 响应 P50/P95/P99</text>
    <text id="c3-n" x="680" y="366" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#00B0F0">分位数暴露尾部劣化</text>
    <rect id="c4" x="952" y="210" width="272" height="190" rx="12" fill="#F4F7FA" stroke="#D7E0E8" stroke-width="1"/>
    <use data-icon="tabler-outline/route" x="976" y="234" width="36" height="36" fill="none" stroke="#0F2B46" stroke-width="2"/>
    <text id="c4-t" x="976" y="300" font-family="SimHei, &quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="24" font-weight="bold" fill="#0F2B46">距离里程 D</text>
    <text id="c4-d" x="976" y="330" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#5A6B7B">空驶/载重/总里程 · 空满比 · 空驶分布</text>
    <text id="c4-n" x="976" y="366" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#00B0F0">阶段切分口径，估算透明</text>
  </g>
  <g id="card-row2">
    <rect id="c5" x="64" y="420" width="272" height="190" rx="12" fill="#F4F7FA" stroke="#D7E0E8" stroke-width="1"/>
    <use data-icon="tabler-outline/package" x="88" y="444" width="36" height="36" fill="none" stroke="#0F2B46" stroke-width="2"/>
    <text id="c5-t" x="88" y="510" font-family="SimHei, &quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="24" font-weight="bold" fill="#0F2B46">货物与吞吐</text>
    <text id="c5-d" x="88" y="540" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#5A6B7B">总/在途/完成吨 · 吨公里 · 待处理损耗</text>
    <text id="c5-n" x="88" y="576" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#00B0F0">吨公里为核心归一化基准</text>
    <rect id="c6" x="360" y="420" width="272" height="190" rx="12" fill="#F4F7FA" stroke="#D7E0E8" stroke-width="1"/>
    <use data-icon="tabler-outline/coins" x="384" y="444" width="36" height="36" fill="none" stroke="#0F2B46" stroke-width="2"/>
    <text id="c6-t" x="384" y="510" font-family="SimHei, &quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="24" font-weight="bold" fill="#0F2B46">成本 C</text>
    <text id="c6-d" x="384" y="540" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#5A6B7B">Cost A–F 闭环 · C2 单位成本</text>
    <text id="c6-n" x="384" y="576" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#00B0F0">F 直接驱动 SA/NF 调度打分</text>
    <rect id="c7" x="656" y="420" width="272" height="190" rx="12" fill="#F4F7FA" stroke="#D7E0E8" stroke-width="1"/>
    <use data-icon="tabler-outline/leaf" x="680" y="444" width="36" height="36" fill="none" stroke="#0F2B46" stroke-width="2"/>
    <text id="c7-t" x="680" y="510" font-family="SimHei, &quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="24" font-weight="bold" fill="#0F2B46">绿色 G</text>
    <text id="c7-d" x="680" y="540" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#5A6B7B">G1 总碳排放 · G2 单位吨公里碳排</text>
    <text id="c7-n" x="680" y="576" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#00B0F0">排放因子配置化，可替换估算</text>
    <rect id="c8" x="952" y="420" width="272" height="190" rx="12" fill="#F4F7FA" stroke="#D7E0E8" stroke-width="1"/>
    <use data-icon="tabler-outline/scale" x="976" y="444" width="36" height="36" fill="none" stroke="#0F2B46" stroke-width="2"/>
    <text id="c8-t" x="976" y="510" font-family="SimHei, &quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="24" font-weight="bold" fill="#0F2B46">公平 F · 可靠 R</text>
    <text id="c8-d" x="976" y="540" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#5A6B7B">F1 基尼 · F2 拒单 · R4 事故 · R5/R6 维修休息</text>
    <text id="c8-n" x="976" y="576" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#00B0F0">随机事件引擎纳入统计</text>
  </g>
  <!-- 页脚 -->
  <line id="footer-line" x1="64" y1="668" x2="1216" y2="668" stroke="#D7E0E8" stroke-width="1"/>
  <text id="footer-src" x="64" y="692" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#5A6B7B">Source: internal/task/stats.go · realtime_stats.go · random_event.go</text>
</svg>